#	File : txrate_cfg_custom.conf
#
#	Custom Tx Rate Configuration for MCS fixed rate testing
#	Usage: mlanutl mlan0 hostcmd config/txrate_cfg_custom.conf <section_name>
#
#	Rate bitmap reference (from GET response analysis):
#	  HRDSSS: bit0=1M, bit1=2M, bit2=5.5M, bit3=11M
#	  OFDM:   bit0=6M, bit1=9M, bit2=12M, bit3=18M, bit4=24M, bit5=36M, bit6=48M, bit7=54M
#	  HT:     Dword0 bits[0-7]=NSS1 MCS0-7, bits[8-15]=NSS2 MCS8-15, Dword1 bit0=MCS32
#	  VHT:    Dword0 bits[0-9]=NSS1 MCS0-9, bits[16-25]=NSS2 MCS0-9
#	  HE:     Dword0 bits[0-11]=NSS1 MCS0-11, bits[16-27]=NSS2 MCS0-11
#
#	Section naming convention:
#	  txrate_cfg_set_he_mcsN   = HE (11ax) MCS N, NSS1+NSS2
#	  txrate_cfg_set_vht_mcsN  = VHT (11ac) MCS N, NSS1+NSS2
#	  txrate_cfg_set_ht_mcsN   = HT (11n) MCS N, NSS1+NSS2 (MCS N + MCS N+8)

## ============================================================
## GET: read current rate scope
## ============================================================
txrate_cfg_get={
	CmdCode=0x00d6
	Action:2=0
	Index:2=0

	TxRateScope.TlvType:2=0x0153
	TxRateScope.TlvLength:2={
	}
}

## ============================================================
##  HE (11ax) MCS0 ~ MCS11, each NSS1+NSS2
##  bitmap: NSS1=bit[N], NSS2=bit[N+16]
## ============================================================

txrate_cfg_set_he_mcs0={
	CmdCode=0x00d6
	Action:2=1
	Index:2=0
	TxRateScope.TlvType:2=0x0153
	TxRateScope.TlvLength:2={
		HRDSSS.RateScope:2=0x0000
		OFDM.RateScope:2=0x0000
		HT.RateScopeDword0:4=0x00000000
		HT.RateScopeDword1:4=0x00000000
		HT.RateScopeDword2:4=0x00000000
		HT.RateScopeDword3:4=0x00000000
		VHT.RateScopeDword0:4=0x00000000
		VHT.RateScopeDword1:4=0x00000000
		VHT.RateScopeDword2:4=0x00000000
		VHT.RateScopeDword3:4=0x00000000
		HE.RateScopeDword0:4=0x00010001
