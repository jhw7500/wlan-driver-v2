name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@c90e3396225cae6e2851690b8991797ea3238f21
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
