name: OpenCode Auto PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  opencode-review:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode-auto-review.yml@c90e3396225cae6e2851690b8991797ea3238f21
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
